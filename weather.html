<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Explorer</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQduVJ9mmKfWHhHhZfjX-odb7Eug2v2OxVBi5D5mj7JlQ&s&ec=121585071">
    <style>
        h1{
            text-align: center;
            color:orange;
        }
        p{
            text-align: center;
            color:gray;
        }
        input{
            margin:0%;
            border-radius: 20px;
            padding: 5px;
            text-align: center;
            align-items: center;
        }
        .input-btn{
                margin:0%;
                border-radius:25px;
                background-color: orange;
                color:white;
        }
    </style>
</head>
<body>
    <h1>Weather Explorer</h1>
    <p>Stay updated with the latest weather conditions</p>
    <form class="input">
        <input type="search" placeholder="Search Here">
        <button  class="input-btn" type="button">Search</button>
    </form>
</body>
</html>
