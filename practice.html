<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Practice </title>
    <style>
        *{
            margin:0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }
        body{
            background: black;
            background-image: url(https://media.istockphoto.com/id/1248378027/vector/vector-seamless-pattern-with-education-back-to-school-icons-doodle-student-dark-background.jpg?s=612x612&w=0&k=20&c=faIgQ0wy5ssG7W-B6GyeFkNEASh9NSraNhNlpe_gbe8=);
        }
        .container{
            width:85%;
            margin: auto;
            margin-top: 40px;
        }
        .title{
            font-size:28px;
            margin-bottom:25px;
            text-align: center;
            color:white;
        }
        .card{
            background:white;
            padding:25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(red, green, blue, alpha);
            margin-bottom: 25px;
        }
        .language{
            display:felx;
            gap:15px;
            margin-top: 15px;
        }
        .language label{
            background: black;
            color:white;
            padding:8px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        .language input{
            display: flex;
            gap:15px;
            margin: top 15px;
        }
        .lang-btn{
            display:none;
        }
        .lang-btn{
            padding: 10px 18px;
            background: black;
            color: white;
            border-radius: 6px;
            cursor:pointer;
            font-size:15px;
            transition: 0.3s;
        }
        .lang-btn:hover{
            background:red;
        }
        .problem-grid{
            display: grid;
            grid-template-columns: repeat(3.1fr);
            gap:20px;
            margin-top:20px
        }
        .btn{
            background-color: aqua;
            padding:8px 14px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            color:white;
        }
        .btn-hover{
            background-color: lightcoral;
        }
    </style>
</head>
<body>
    <diV class="container">
        <h1 class="title">programming pratice</h1>
        <div class="card">
            <h2>Select Language</h2>
            <div class="language">
                <label class=".lang-btn">
                    <input type="radio" name="lang">Java
                </label>
                <br>
                <br>
                   <label class=".lang-btn">
                    <input type="radio" name="lang">c++
                </label>
                <br>
                <br>
                   <label class=".lang-btn">
                    <input type="radio" name="lang">Python
                </label>
                <br><br>
                   <label class=".lang-btn">
                    <input type="radio" name="lang">.Net
                </label>
            </div>
        </div>
    </diV>
</body>
</html>
