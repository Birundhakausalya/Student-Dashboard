<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="resume" href="resume.html">
    <link rel="Dash" href="Dash.html">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:arial;
        }
        .hero{
            height:100vh;
            background-image: url("schl.png");
            background-size:cover;
            background-position: center;
            display:flex;
            align-items:center;
            justify-content: center;
            animation: Zoom 30s infinite alternate;
        }
        @keyframes Zoom{
            0%{
                transform:scale(1);
            }
            10%{
                transform:scale(1.1);
            }
        }
        .content{
            background:rgba(red, green, blue, alpha);
            padding:50px;
            border-radius: 10px;
            text-align: center;
            color:white;
        }
        .typing{
            overflow:hidden;
            border-right:3px solid white;
            white-space:nowrap;
            width:0;
            animation:
            typing 5s steps(30,end) forwards,blink 1s infinite;
        }
        @keyframes typing{
            from{width:0}
            to{width:100%}
        }
        p{
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .button{
            display:flex;
            gap:20px;
            justify-content: center;
        }
        .btn{
            text-decoration: none;
            background: brown;
            color:black;
            padding:10px 25px;
            border-radius:5px;
            font-weight: bold;
        }
        .btn:hover{
            background:white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="content">
            <h1 class="typing">
                Welcome to Student Portal
            </h1>
            <p>Your Smart College Dashboard</p>
            <div class="button">
                <a href="login.html" class="btn">Login</a>
                <a href="reg.html" class="btn">Register</a>
            </div>
        </div>
    </div>
</body>
</html>
