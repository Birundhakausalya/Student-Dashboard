<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body{
           margin: 0;
           font-family:arial;
           background: lightgreen;
           background-image: url(https://media.istockphoto.com/id/1248378027/vector/vector-seamless-pattern-with-education-back-to-school-icons-doodle-student-dark-background.jpg?s=612x612&w=0&k=20&c=faIgQ0wy5ssG7W-B6GyeFkNEASh9NSraNhNlpe_gbe8=);

        }
        .topbar{
            background:lightseagreen;
            color:white;
            padding:15px;
            display:flex;
            align-items: center;
        }
        .menu-icon{
            font-size:25px;
            cursor: pointer;
            margin-right: 15px;
        }
        #menu{
            display:none;
        }
        .sidebar{
            position:fixed;
            left: -250px;
            top:0;
            width:250px;
            height:100%;
            background: lightcoral;
            color:white;
            transition: 0.4s;
            padding-top: 60px;
        }
        .sidebar a{
            display:block;
            padding:15px;
            color:white;
            text-decoration: none;
        }
        .sidebar a:hover{
            background:rgb(194, 48, 48);
        }
        #menu:checked ~ .sidebar{
            left:0;
        }
        .content{
            margin-left: 20px;
            padding:30px;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="menu">
    <div class="topbar">
        <label for="menu" class="menu-icon">☰</label>
        <h2>Student Dashboard</h2>
    </div>
    <div class="sidebar">
        <a href="profile.html">Profile</a>
        <a href="Att.html">Attendance</a>
        <a href="Assignment.html">Assignments</a>
        <a href="Study.html">Study Materials</a>
        <a href="Re.html">Resume Upload</a>
        <a href="Apti.html">Aptituded Test</a>
        <a href="practice.html">Programming Practice</a>
        <a href="#">Performance</a>
        <a href="#">Settings</a>
        <a href="#">Contact Support</a>
    </div>
    </div>
</body>
</html>
