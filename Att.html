<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <style>
        body{
            font-family:Arial;
            margin:0;
            background: lightcoral;
        }
        .container{
            width:85%;
            margin:auto;
            margin-top: 40px;
            text-align: center;
        }
        title{
           font-size: 28px;
           margin-bottom: 25px;
        }
        .cards{
            display: flex;
            gap:20px;
            margin-bottom: 30px;
            text-align: center;
        }
        .card{
            flex:1;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(red, green, blue, alpha);
            text-align: center;
        }
        .card h2{
                color:aqua;
                margin-top:10px;
        }
        .table-box{
            background: white;
            padding: 25px;
            border-radius:10px;
            box-shadow: 0 4px 10px rgba(red, green, blue, alpha);
            margin-bottom: 30px;
        }
        table{
            width:100%;
            border-collapse: collapse;
            margin-top: 15px;
            cursor: pointer;
        }
         table-hover{
            background-color: aqua;
        }
        th{
            padding:12px;
            background:lightblue;
            color:white;
        }
        td{
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid black;
        }
        .progress-box{
            background: white;
            padding:25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(red, green, blue, alpha);
        }
        .progress{
            background: black;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(red, green, blue, alpha);
        }
        .bar{
            height:15px;
            background:lightgreen;
            border-radius: 20px;
            width: 55%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Attendance Dashboard</div>
        <br>
        <br>
        <div class="cards">
            <div class="cards">
                <div class="card">
                    <div class="bar" style="width:113%"></div>
                    <p>Total Classes</p>
                    <h2>113</h2>
                </div>
                <div class="card">
                    <div class="bar" style="width:97%"></div>
                    <p>Classes Attended</p>
                    <h2>97</h2>
                </div>
                <div class="card">
                    <div class="bar" style="width:85%"></div>
                    <p>overall %</p>
                    <h2>85%</h2>
                </div>
            </div>
            <div class="table-box">
                <h2>Subject Wise Attendance</h2>
                <div class="table-hover">
        <table >
            <tr>
                <th>Subject</th>
                <th>Classes Held</th>
                <th>Attended</th>
                <th>Percentage</th>
            </tr>
            <tr>
                <td>Data Structures</td>
                <td>40</td>
                <td>35</td>
                <td>87%</td>
            </tr>
            <tr>
                <td>Operating System</td>
                <td>38</td>
                <td>32</td>
                <td>84%</td>
            </tr>
            <tr>
                <td>Computer Networks</td>
                <td>35</td>
                <td>30</td>
                <td>85%</td>
            </tr>
        </table>
        </div>
        </div>
        <br>
        <div class="progress-box">
        <h3>Overall Attendance Progress</h3>
        <div class="progress">
            <div class="bar"></div>
        </div>
        </div>
    </div>
</body>
</html>
