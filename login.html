<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body{
            margin:0;
            font-family:arial;
            background:aqua;
            background-size: cover;
            height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .login-box{
            background:white;
            padding:40px;
            width:320px;
            border-radius:10px;
            text-align: center;
            box-shadow: 0 5px 10px rgba(red, green, blue, alpha);
        }
        input{
            width:90%;
            padding:10px;
            margin:10px;
            border: 1px solid lightgreen;
            border-radius: 5px;
        }
        button{
            width:95%;
            padding:10px;
            background: rgb(228, 8, 41);
            border:none;
            color:white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover{
                background: lightgreen;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Student Login</h2>
        <form action="Dash.html">
            <input type="text" palceholder="Student ID" required>
            <input type="password" placeholder="Password" required>
            <button type="Submit">Login</button>
        </form>
        <p>Don't have an Account?</p>
        <a href="reg.html">Register</a>
    </div>
</body>
</html>
